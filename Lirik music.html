<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thailand Style</title>
    <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030305;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        #bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(147, 51, 234, 0.4) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.3) 0%, transparent 40%),
                radial-gradient(circle at center, #1e1b4b 0%, #030305 90%);
            z-index: 1;
            animation: bgGlowPulse 2s infinite alternate ease-in-out;
        }

        @keyframes bgGlowPulse {
            0% { filter: brightness(0.9) contrast(100%); transform: scale(1); }
            100% { filter: brightness(1.2) contrast(110%); transform: scale(1.02); }
        }
		
        #particles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform, opacity;
            animation: floatUpBurst var(--duration) cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes floatUpBurst {
            0% {
                transform: translateY(0) scale(0.4);
                opacity: 1;
            }
            70% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-80vh) scale(1.2);
                opacity: 0;
            }
        }

        #emoji-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .emoji-sticker {
            position: absolute;
            user-select: none;
            will-change: transform, opacity;
            animation: boomPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6));
        }

        @keyframes boomPop {
            0% {
                transform: scale(0.1) rotate(var(--start-rot));
                opacity: 0;
            }
            40% {
                transform: scale(1.3) rotate(var(--mid-rot));
                opacity: 1;
            }
            100% {
                transform: scale(0.9) translateY(-30px) rotate(var(--end-rot));
                opacity: 0;
            }
        }

        .content-box {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 20px;
            max-width: 90%;
        }

        .gradient-text {
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            font-weight: 900;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #00f0ff 0%, #d946ef 50%, #ff007f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            /* Shadow tebal warna hitam pekat di belakang teks biar kontras dan jelas dibaca */
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 0 30px rgba(147, 51, 234, 0.5);
            animation: beatPulse 0.35s infinite alternate ease-in-out;
        }

        @keyframes beatPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.04); }
        }

        .jj-impact {
            animation: jjCombo 0.35s cubic-bezier(0.175, 0.885, 0.32, 0.55) both;
        }

        @keyframes jjCombo {
            0% { 
                transform: scale(0.6) rotate(-3deg); 
                filter: drop-shadow(-8px 0 #00f0ff) drop-shadow(8px 0 #ff007f);
                opacity: 0.5;
            }
            30% { 
                transform: scale(1.25) rotate(2deg) translate(-4px, 2px); 
                filter: drop-shadow(10px 0 #00f0ff) drop-shadow(-10px 0 #0a192f);
                opacity: 1;
            }
            60% { 
                transform: scale(0.95) translate(3px, -2px); 
            }
            100% { 
                transform: scale(1) rotate(0deg) translate(0); 
            }
        }
    </style>
</head>

        function parseLRC(lrc) {
            const lines = lrc.split('\n');
            const result = [];
            const timeReg = /\[(\d{2}):(\d{2}\.\d{2})\]/;

            lines.forEach(line => {
                const match = timeReg.exec(line);
                if (match) {
                    const min = parseFloat(match[1]);
                    const sec = parseFloat(match[2]);
                    const text = line.replace(timeReg, '').trim();
                    result.push({ time: min * 60 + sec, text });
                }
            });
            return result;
        }

        const lyrics = parseLRC(lrcText);
        let isStarted = false;

        document.body.addEventListener('click', () => {
            if (!isStarted) {
                isStarted = true;
                triggerJJEffect();

                audio.play().then(() => {
                    startStickerBeat();
                }).catch(err => {
                    alert("Error Memutar 'w1.mp3'. Cek nama file!");
                });
            }
        });
		
        audio.addEventListener('timeupdate', () => {
            const currentTime = audio.currentTime;

            for (let i = lyrics.length - 1; i >= 0; i--) {
                if (currentTime >= lyrics[i].time) {
                    if (lyricLine.innerText !== lyrics[i].text) {
                        lyricLine.innerText = lyrics[i].text;
                        triggerJJEffect(); // Panggil efek JJ & letupan partikel
                    }
                    break;
                }
            }
        });

        function triggerJJEffect() {
            // 1. Animasi Teks JJ
            lyricLine.classList.remove('jj-impact');
            void lyricLine.offsetWidth;
            lyricLine.classList.add('jj-impact');

            // 2. Letupan Partikel Dari Bawah Ke Atas
            spawnParticleBurst();
        }

        function spawnParticleBurst() {
            const colors = ['#00f0ff', '#d946ef', '#ff007f', '#ffffff', '#eab308'];
            const particleCount = 35;

            for (let i = 0; i < particleCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle';

                // Ukuran acak
                const size = Math.random() * 6 + 3; // 3px - 9px
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;

                // Warna acak + glow neon
                const color = colors[Math.floor(Math.random() * colors.length)];
                p.style.backgroundColor = color;
                p.style.boxShadow = `0 0 12px ${color}`;

                // Posisi dari Bawah Layar (X menyebar acak, Y di bawah)
                p.style.left = `${Math.random() * 100}%`;
                p.style.top = `${Math.random() * 10 + 90}%`; // 90% - 100% (dasar layar)

                // Kecepatan melayang acak
                const duration = Math.random() * 0.8 + 0.8; // 0.8 detik - 1.6 detik
                p.style.setProperty('--duration', `${duration}s`);

                particlesContainer.appendChild(p);

                // Hapus partikel otomatis setelah animasi selesai biar gak berat
                setTimeout(() => {
                    p.remove();
                }, duration * 1000);
            }
        }

        function startStickerBeat() {
            setInterval(() => {
                if(!audio.paused && !audio.ended) {
                    if(Math.random() > 0.25) {
                        spawnEmoji();
                    }
                }
            }, 150);
        }

        function spawnEmoji() {
            const emoji = document.createElement('div');
            emoji.className = 'emoji-sticker';
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];

            const randomSize = (Math.random() * 1.5 + 3.0).toFixed(1);
            emoji.style.fontSize = `${randomSize}rem`;

            const startRot = `${Math.floor(Math.random() * 40 - 20)}deg`;
            const midRot = `${Math.floor(Math.random() * 60 - 30)}deg`;
            const endRot = `${Math.floor(Math.random() * 80 - 40)}deg`;

            emoji.style.setProperty('--start-rot', startRot);
            emoji.style.setProperty('--mid-rot', midRot);
            emoji.style.setProperty('--end-rot', endRot);

            const padding = 70;
            const x = Math.random() * (window.innerWidth - padding * 2) + padding;
            const y = Math.random() * (window.innerHeight - padding * 2) + padding;

            emoji.style.left = `${x}px`;
            emoji.style.top = `${y}px`;

            emojiContainer.appendChild(emoji);

            setTimeout(() => {
                emoji.remove();
            }, 600);
        }
