    <script>
        let audioCtx;
        function getAudioContext() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        function playSound(type){
            try {
                const ctx = getAudioContext();
                if(ctx.state === "suspended") ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);

                if(type === "correct"){
                    osc.type = "triangle";
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(); osc.stop(ctx.currentTime + 0.3);
                 } else if(type === "wrong") {
					osc.type = "sawtooth";
					osc.frequency.setValueAtTime(220, ctx.currentTime);
					osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.3);
					gain.gain.setValueAtTime(0.4, ctx.currentTime);
					gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
					osc.start(); osc.stop(ctx.currentTime + 0.3);
				} else if(type === "clue") { 
					// SFX CYBER UNLOCK CLUE
					osc.type = "sine";
					osc.frequency.setValueAtTime(800, ctx.currentTime);
					osc.frequency.exponentialRampToValueAtTime(1400, ctx.currentTime + 0.15);
					gain.gain.setValueAtTime(0.2, ctx.currentTime);
					gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
					osc.start(); osc.stop(ctx.currentTime + 0.15);
				}
            } catch(e) {}
        }

        let currentIdx = 0;
        let totalScore = 0;
        let currentClueLevel = 1;
        let currentPotential = 100;

        const quizCard = document.getElementById("quiz-card");
        const qNumber = document.getElementById("question-number");
        const scorePotentialEl = document.getElementById("score-potential");
        const clueList = document.getElementById("clue-list");
        const btnMoreClue = document.getElementById("btn-more-clue");
        const optionsEl = document.getElementById("options");
        const essayBox = document.getElementById("essay-box");
        const essayInput = document.getElementById("essay-input");
        const submitEssayBtn = document.getElementById("submit-essay-btn");
        const nextBtn = document.getElementById("next-btn");
        const quizBox = document.getElementById("quiz-box");
        const scoreBox = document.getElementById("score-box");
        const finalScoreEl = document.getElementById("final-score");
        const scoreComment = document.getElementById("score-comment");

        const prefixes = ["A", "B", "C", "D", "E", "F"];

    function loadQuestion() {
		resetState();
		document.querySelector(".version-badge").style.display = "inline-block"
		const q = quizData[currentIdx];
		qNumber.innerText = `SOAL ${currentIdx + 1} / ${quizData.length}`;
    
		currentClueLevel = 1;
		currentPotential = 100;
		updatePotentialUI();

    clueList.innerHTML = `<p class="clue-text"><b>Soal:</b> ${q.question}</p>`;
    btnMoreClue.innerText = "💡 Buka Clue (-50 Poin)";
    btnMoreClue.disabled = false;
    btnMoreClue.style.display = "inline-block";

		if(q.type === "multiple") {
			optionsEl.style.display = "grid";
			essayBox.style.display = "none";
			q.options.forEach((optText, index) => {
				const btn = document.createElement("button");
				btn.classList.add("btn-option");
				btn.innerHTML = `<span class="opt-prefix">${prefixes[index]}</span> <span>${optText}</span>`;
				btn.addEventListener("click", () => selectAnswer(btn, index));
				optionsEl.appendChild(btn);
			});
		} else {
			optionsEl.style.display = "none";
			essayBox.style.display = "block";
			essayInput.value = "";
			essayInput.disabled = false;
			submitEssayBtn.disabled = false;
		}
	}

	function unlockNextClue() {
		const q = quizData[currentIdx];
		if(currentPotential === 100) {
			playSound("clue");
			const clueP = document.createElement("p");
			clueP.classList.add("clue-text");
			clueP.style.color = "#ffcc00";
			clueP.innerHTML = `<b>Clue:</b> ${q.clue}`;
			clueList.appendChild(clueP);

			currentPotential = 50;
			updatePotentialUI();
			btnMoreClue.disabled = true;
		}
	} 

        function updatePotentialUI() {
            scorePotentialEl.innerText = `POTENSI POIN: ${currentPotential}`;
        }

        function resetState() {
            nextBtn.style.display = "none";
            optionsEl.innerHTML = "";
        }

        function selectAnswer(btn, selectedIdx) {
            const q = quizData[currentIdx];
            const allBtns = optionsEl.children;
            for(let b of allBtns) b.disabled = true;
            btnMoreClue.disabled = true;

            if(selectedIdx === q.answer) {
                btn.classList.add("correct");
                playSound("correct");
                totalScore += currentPotential;
            } else {
                btn.classList.add("wrong");
                playSound("wrong");
                quizCard.classList.add("shake");
                setTimeout(() => quizCard.classList.remove("shake"), 400);
            }
            nextBtn.style.display = "block";
        }

        function checkEssayAnswer() {
            const val = essayInput.value.trim().toLowerCase();
            if(val === "") return;
            const q = quizData[currentIdx];
            const isCorrect = q.keywords.some(k => val.includes(k));
            
            essayInput.disabled = true;
            submitEssayBtn.disabled = true;
            btnMoreClue.disabled = true;

            if(isCorrect) {
                playSound("correct");
                totalScore += currentPotential;
                essayInput.style.borderColor = "#4caf50";
            } else {
                playSound("wrong");
                quizCard.classList.add("shake");
                setTimeout(() => quizCard.classList.remove("shake"), 400);
                essayInput.style.borderColor = "#ef5350";
            }
            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentIdx++;
            if(currentIdx < quizData.length) loadQuestion();
            else showScore();
        }

        function showScore() {
    quizBox.style.display = "none";
    scoreBox.style.display = "block";

    // Total poin dibagi 25 biar mentok di 100
    const finalScore = Math.round(totalScore / quizData.length);

    finalScoreEl.innerText = finalScore;
	
	if (typeof confeti === 'function' && finalScore > 0) {
		confetti({
			particleCount: 100,
			spread: 70,
			origin: {y:0.6}
		});
	}

    if(finalScore >= 90) {
        scoreComment.innerText = "Gokil! Masih fresh ternyata nih, btw gak nanya AI kan?😭👑🔥";
    } else if(finalScore >= 50) {
        scoreComment.innerText = "Lumayan lah ya, masi aman kan? coba scroll tiktok bntr biar fresh🥶🤏";
    } else {
        scoreComment.innerText = "Parah bener, skor lu kecil gara-gara kebanyakan nethink/buka clue + salah jawab🤣 Ngulang gih!";
    }
}

        function restartQuiz() {
            currentIdx = 0;
            totalScore = 0;
            quizBox.style.display = "block";
            scoreBox.style.display = "none";
            loadQuestion();
        }

        setTimeout(() => {
            loadQuestion();
        }, 7000);
		
		let isPlaying = false;
			let currentTrackIdx = 0;
			let bgmInterval = null;
			let timerInterval = null;
			let currentSeconds = 0;
			const trackDuration = 30; // 30 detik loop

			const tracks = [
				{ title: "🎵 MUSIC 1: CHILL ARCADE", type: "square", speed: 250 },
				{ title: "⚡ MUSIC 2: INTENSE LOGIC", type: "triangle", speed: 170 }
			];

		const NOTES = {
			C4: 261.63, E4: 329.63, G4: 392.00, A4: 440.00, B4: 493.88,
			C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.00
		};

		const melodyTrack1 = [
			NOTES.C4, NOTES.E4, NOTES.G4, NOTES.C5, 
			NOTES.E4, NOTES.G4, NOTES.C5, NOTES.E5,
			NOTES.A4, NOTES.C5, NOTES.E5, NOTES.A5,
			NOTES.G4, NOTES.B4, NOTES.D5, NOTES.G5
		];

		const melodyTrack2 = [
			NOTES.E5, NOTES.B4, NOTES.C5, NOTES.D5,
			NOTES.C5, NOTES.B4, NOTES.A4, NOTES.A4,
			NOTES.C5, NOTES.E5, NOTES.D5, NOTES.C5,
			NOTES.B4, NOTES.C5, NOTES.D5, NOTES.E5
		];

	let noteIdx = 0;

		function playNote(freq, type, duration = 0.15) {
			if (!isPlaying) return;
			try {
				const ctx = getAudioContext();
				if (ctx.state === "suspended") ctx.resume();

				const osc = ctx.createOscillator();
				const gain = ctx.createGain();

				osc.type = type;
				osc.frequency.setValueAtTime(freq, ctx.currentTime);

				gain.gain.setValueAtTime(0.15, ctx.currentTime);
				gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

			osc.connect(gain);
				gain.connect(ctx.destination);

				osc.start();
				osc.stop(ctx.currentTime + duration);
			} catch(e) {}
		}

		function startBGM() {
			stopBGM();
			const activeTrack = tracks[currentTrackIdx];
			const melody = currentTrackIdx === 0 ? melodyTrack1 : melodyTrack2;

		bgmInterval = setInterval(() => {
			playNote(melody[noteIdx], activeTrack.type);
			noteIdx = (noteIdx + 1) % melody.length;
		}, activeTrack.speed);

		timerInterval = setInterval(() => {
			currentSeconds++;
			if (currentSeconds > trackDuration) currentSeconds = 0;
			updatePlayerUI();
			}, 1000);
		}

		function stopBGM() {
			if (bgmInterval) clearInterval(bgmInterval);
			if (timerInterval) clearInterval(timerInterval);
			bgmInterval = null;
			timerInterval = null;
		}

		function togglePlayPause() {
			const playBtn = document.getElementById("play-pause-btn");
			isPlaying = !isPlaying;

			if (isPlaying) {
				playBtn.innerText = "❚❚";
				startBGM();
			} else {
				playBtn.innerText = "▶";
			stopBGM();
			}
		}

		function nextTrack() {
			currentTrackIdx = (currentTrackIdx + 1) % tracks.length;
			changeTrackUI();
		}

		function prevTrack() {
			currentTrackIdx = (currentTrackIdx - 1 + tracks.length) % tracks.length;
			changeTrackUI();
		}

		function changeTrackUI() {
			noteIdx = 0;
			currentSeconds = 0;
			document.getElementById("track-title").innerText = tracks[currentTrackIdx].title;
			updatePlayerUI();
			if (isPlaying) startBGM();
		}

		function updatePlayerUI() {
			const progressBar = document.getElementById("progress-bar");
			const currentTimeEl = document.getElementById("current-time");
    
			const percentage = (currentSeconds / trackDuration) * 100;
			progressBar.style.width = `${percentage}%`;

			const mins = Math.floor(currentSeconds / 60);
			const secs = currentSeconds % 60;
			currentTimeEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
		}
    </script>
