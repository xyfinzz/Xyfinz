<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Knight Runner - HARDCORE LEVEL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #09120d;
            color: #fff;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameCanvas {
            background: #0f2318;
            border: 2px solid #ff0055;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.4);
            border-radius: 8px;
            max-width: 100%;
        }

        .controls-container {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
        }

        .btn-touch {
            width: 42px;
            height: 42px;
            background: rgba(255, 0, 85, 0.1);
            border: 1.5px solid #ff0055;
            color: #ff0055;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            cursor: pointer;
        }

        .btn-touch:active {
            background: #ff0055;
            color: #000;
        }

        #storeModal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(9, 18, 13, 0.98);
            border: 2px solid #f1c40f;
            box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
            border-radius: 10px;
            padding: 12px;
            width: 85%;
            max-width: 280px;
            text-align: center;
            z-index: 100;
        }

        .store-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #2ecc71;
            border-radius: 6px;
            padding: 8px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .btn-buy {
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 6px 8px;
            font-size: 10px;
            font-weight: bold;
            font-family: monospace;
            border-radius: 5px;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-buy:disabled {
            background: #444;
            color: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h4 style="margin-bottom: 6px; color: #ff0055; font-size: 11px;">⚔️ KNIGHT STAGE - XF PROJECT ⚔️</h4>
    
    <div style="position: relative;">
        <canvas id="gameCanvas" width="600" height="300"></canvas>

        <div id="storeModal">
            <h4 style="color: #f1c40f; margin-bottom: 3px; font-size: 14px;">🛒 ITEM STORE</h4>
            <p style="font-size: 9px; color: #aaa; margin-bottom: 8px;">Gunakan Score untuk membeli Item</p>
            
            <div class="store-item">
                <div style="text-align: left;">
                    <div style="color: #00f0ff; font-weight: bold; font-size: 11px;">🛡️ Shield (Kebal 1 Hit)</div>
                    <div style="font-size: 9px; color: #aaa;">150 Score | Max: 3</div>
                </div>
                <button class="btn-buy" id="buyShield">Beli (<span id="shieldCount">0</span>/3)</button>
            </div>

            <div class="store-item">
                <div style="text-align: left;">
                    <div style="color: #9b59b6; font-weight: bold; font-size: 11px;">👻 Ghost (Tembus 3dtk)</div>
                    <div style="font-size: 9px; color: #aaa;">550 Score | Max: 1</div>
                </div>
                <button class="btn-buy" id="buyGhost">Beli (<span id="ghostCount">0</span>/1)</button>
            </div>

            <button class="btn-buy" id="closeStore" style="background: #ff0055; color: #fff; width: 100%; margin-top: 6px; padding: 8px; font-size: 11px;">TUTUP TOKO</button>
        </div>
    </div>

    <div class="controls-container">
        <div class="btn-touch" id="btnLeft">◀</div>
        <div class="btn-touch" id="btnJump" style="border-color:#ff007f; color:#ff007f;">▲</div>
        <div class="btn-touch" id="btnRight">▶</div>
        <div class="btn-touch" id="btnGhost" style="border-color:#9b59b6; color:#9b59b6; font-size: 11px; display: none;">👻 GHOST</div>
        <div class="btn-touch" id="btnOpenStore" style="border-color:#f1c40f; color:#f1c40f; font-size: 11px;">🛒 STORE</div>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const world = { width: 3800, height: 300 };
    const groundY = world.height - 40;

    // ASET KSATRIA (KNIGHT) & ENEMY
    const playerImg = new Image();
    playerImg.src = "https://raw.githubusercontent.com/kenney-assets/platformer-art-deluxe/master/Base/p2_front.png";

    const monsterImg = new Image();
    monsterImg.src = "https://raw.githubusercontent.com/kenney-assets/platformer-art-deluxe/master/Enemies/slimeWalk1.png";

    const ghostImg = new Image();
    ghostImg.src = "https://raw.githubusercontent.com/kenney-assets/platformer-art-deluxe/master/Enemies/ghost.png";

    // -------------------------------------------------------------
    // WEB AUDIO API SYSTEM (SFX SINTETIS MIRIP PROYEK KUIS 4.0)
    // -------------------------------------------------------------
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioCtx();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'jump') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'coin') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.08);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'hit') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(120, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.2);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'buy') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.setValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.start(now);
            osc.stop(now + 0.25);
        } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.5);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        } else if (type === 'win') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.setValueAtTime(600, now + 0.15);
            osc.frequency.setValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    // -------------------------------------------------------------
    // GAME VARIABLES & STATE
    // -------------------------------------------------------------
    let gameOver = false;
    let gameWin = false;
    let isPaused = false;
    let screenShake = 0;
    let cameraX = 0;
    let animTimer = 0;

    let particles = [];
    let floatingTexts = [];

    const player = {
        x: 50,
        y: 150,
        width: 35,
        height: 45,
        speedX: 0,
        speedY: 0,
        maxSpeed: 4.5,
        gravity: 0.5,
        jumpPower: -10.5,
        isGrounded: false,
        facingLeft: false,
        hp: 100,
        maxHp: 100,
        score: 0,
        invincibleTimer: 0,
        hasShield: false,
        shieldPurchased: 0,
        ghostCharges: 0,
        ghostPurchased: 0,
        isGhostActive: false,
        ghostTimer: 0
    };

    const grounds = [
        { x: 0, width: 500 },
        { x: 620, width: 500 },
        { x: 1240, width: 500 },
        { x: 1860, width: 500 },
        { x: 2480, width: 450 },
        { x: 3050, width: 750 }
    ];

    const platforms = [
        { x: 520, y: 190, width: 80, height: 15 },
        { x: 1140, y: 180, width: 80, height: 15 },
        { x: 1760, y: 180, width: 80, height: 15 },
        { x: 2380, y: 170, width: 80, height: 15 },
        { x: 2950, y: 170, width: 80, height: 15 }
    ];

    // TOTAL 18 MOB DENGAN TINGKAT KESULITAN BERTAHAP
    const patrolMonsters = [
        // Area 1 (Easier)
        { x: 220, y: groundY - 35, width: 35, height: 35, speedX: 2.0, alive: true, minX: 100, maxX: 450 },
        { x: 400, y: groundY - 35, width: 35, height: 35, speedX: -2.2, alive: true, minX: 200, maxX: 480 },
        { x: 750, y: groundY - 35, width: 35, height: 35, speedX: -2.5, alive: true, minX: 640, maxX: 1050 },
        // Area 2 (Medium)
        { x: 1350, y: groundY - 35, width: 35, height: 35, speedX: 3.2, alive: true, minX: 1260, maxX: 1650 },
        { x: 1550, y: groundY - 35, width: 35, height: 35, speedX: -3.5, alive: true, minX: 1300, maxX: 1700 },
        { x: 1950, y: groundY - 35, width: 35, height: 35, speedX: -3.8, alive: true, minX: 1880, maxX: 2250 },
        // Area 3 (Hardcore)
        { x: 2550, y: groundY - 35, width: 35, height: 35, speedX: 4.2, alive: true, minX: 2500, maxX: 2850 },
        { x: 3150, y: groundY - 35, width: 35, height: 35, speedX: -4.5, alive: true, minX: 3080, maxX: 3300 },
        { x: 3520, y: groundY - 35, width: 35, height: 35, speedX: -5.0, alive: true, minX: 3450, maxX: 3650 }
    ];

    const undergroundMonsters = [
        { x: 350, y: groundY + 40, targetY: groundY - 35, width: 35, height: 35, spawned: false, alive: true, triggerDist: 80 },
        { x: 900, y: groundY + 40, targetY: groundY - 35, width: 35, height: 35, spawned: false, alive: true, triggerDist: 80 },
        { x: 1500, y: groundY + 40, targetY: groundY - 35, width: 35, height: 35, spawned: false, alive: true, triggerDist: 80 },
        { x: 2100, y: groundY + 40, targetY: groundY - 35, width: 35, height: 35, spawned: false, alive: true, triggerDist: 80 },
        { x: 2700, y: groundY + 40, targetY: groundY - 35, width: 35, height: 35, spawned: false, alive: true, triggerDist: 80 },
        { x: 3400, y: groundY + 40, targetY: groundY - 35, width: 35, height: 35, spawned: false, alive: true, triggerDist: 80 }
    ];

    // MOB BARU: HANTU TERBANG (GHOST FLYING MOB)
    const flyingMonsters = [
        { x: 1180, startY: 100, y: 100, width: 30, height: 30, range: 60, speedY: 0.05, alive: true },
        { x: 1800, startY: 90, y: 90, width: 30, height: 30, range: 70, speedY: 0.06, alive: true },
        { x: 2980, startY: 80, y: 80, width: 30, height: 30, range: 80, speedY: 0.08, alive: true }
    ];

    const flag = { x: 3720, y: groundY - 60, width: 30, height: 60 };

    const coins = [
        { x: 300, y: groundY - 50, radius: 8, collected: false },
        { x: 550, y: 140, radius: 8, collected: false },
        { x: 800, y: groundY - 50, radius: 8, collected: false },
        { x: 1170, y: 130, radius: 8, collected: false },
        { x: 1400, y: groundY - 50, radius: 8, collected: false },
        { x: 1790, y: 130, radius: 8, collected: false },
        { x: 2000, y: groundY - 50, radius: 8, collected: false },
        { x: 2410, y: 120, radius: 8, collected: false },
        { x: 2800, y: groundY - 50, radius: 8, collected: false },
        { x: 3200, y: groundY - 50, radius: 8, collected: false },
        { x: 3600, y: groundY - 50, radius: 8, collected: false }
    ];

    const keys = { left: false, right: false, up: false };

    // EFEK PARTIKEL DEBU & TEXT MELAYANG
    function addDust(x, y) {
        for (let i = 0; i < 5; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                life: 15,
                color: "#7f8c8d"
            });
        }
    }

    function addFloatingText(text, x, y, color) {
        floatingTexts.push({
            text: text,
            x: x,
            y: y,
            vy: -1,
            life: 30,
            color: color
        });
    }

    // CONTROLS & LISTENERS
    window.addEventListener("keydown", (e) => {
        initAudio();
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
        if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
        if ((e.key === "ArrowUp" || e.key === "w" || e.key === " ") && player.isGrounded && !gameOver && !gameWin && !isPaused) {
            player.speedY = player.jumpPower;
            player.isGrounded = false;
            playSound('jump');
            addDust(player.x + player.width / 2, player.y + player.height);
        }
        if (e.key === "e" || e.key === "E") activateGhostMode();
    });

    window.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
        if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
    });

    const bindTouch = (btnId, keyName) => {
        const btn = document.getElementById(btnId);
        btn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            initAudio();
            if (gameOver || gameWin || isPaused) return;
            if (keyName === "up" && player.isGrounded) {
                player.speedY = player.jumpPower;
                player.isGrounded = false;
                playSound('jump');
                addDust(player.x + player.width / 2, player.y + player.height);
            } else {
                keys[keyName] = true;
            }
        });
        btn.addEventListener("touchend", (e) => {
            e.preventDefault();
            if (keyName !== "up") keys[keyName] = false;
        });
    };

    bindTouch("btnLeft", "left");
    bindTouch("btnRight", "right");
    bindTouch("btnJump", "up");

    const storeModal = document.getElementById("storeModal");
    document.getElementById("btnOpenStore").addEventListener("click", () => {
        initAudio();
        if (gameOver || gameWin) return;
        isPaused = true;
        storeModal.style.display = "block";
        updateStoreUI();
    });

    document.getElementById("closeStore").addEventListener("click", () => {
        initAudio();
        isPaused = false;
        storeModal.style.display = "none";
    });

    function updateStoreUI() {
        document.getElementById("shieldCount").innerText = player.shieldPurchased;
        document.getElementById("ghostCount").innerText = player.ghostPurchased;

        const buyShieldBtn = document.getElementById("buyShield");
        const buyGhostBtn = document.getElementById("buyGhost");

        buyShieldBtn.disabled = player.score < 150 || player.shieldPurchased >= 3 || player.hasShield;
        buyGhostBtn.disabled = player.score < 550 || player.ghostPurchased >= 1;
    }

    document.getElementById("buyShield").addEventListener("click", () => {
        if (player.score >= 150 && player.shieldPurchased < 3 && !player.hasShield) {
            player.score -= 150;
            player.hasShield = true;
            player.shieldPurchased++;
            playSound('buy');
            updateStoreUI();
        }
    });

    document.getElementById("buyGhost").addEventListener("click", () => {
        if (player.score >= 550 && player.ghostPurchased < 1) {
            player.score -= 550;
            player.ghostCharges++;
            player.ghostPurchased++;
            playSound('buy');
            updateStoreUI();
            checkGhostButtonVisibility();
        }
    });

    function activateGhostMode() {
        if (player.ghostCharges > 0 && !player.isGhostActive) {
            player.ghostCharges--;
            player.isGhostActive = true;
            player.ghostTimer = 180;
            playSound('buy');
            checkGhostButtonVisibility();
        }
    }

    document.getElementById("btnGhost").addEventListener("click", activateGhostMode);

    function checkGhostButtonVisibility() {
        const btnGhost = document.getElementById("btnGhost");
        btnGhost.style.display = player.ghostCharges > 0 ? "flex" : "none";
    }

    // TAMPILAN BACKGROUND
    function drawAdvancedBackground() {
        ctx.fillStyle = "#09120d";
        ctx.fillRect(0, 0, world.width, world.height);

        // BUKIT
        ctx.fillStyle = "#0c1d14";
        for (let x = -200; x < world.width + 200; x += 180) {
            ctx.beginPath();
            ctx.arc(x + (cameraX * 0.4), groundY - 40, 140, 0, Math.PI * 2);
            ctx.fill();
        }

        // POHON
        for (let x = 20; x < world.width; x += 90) {
            let treeHeight = (x % 3 === 0) ? 120 : (x % 2 === 0 ? 90 : 105);
            let treeColor = (x % 3 === 0) ? "#1e5233" : (x % 2 === 0 ? "#143a24" : "#276842");

            ctx.fillStyle = "#2d1d13";
            ctx.fillRect(x + 12, groundY - treeHeight + 30, 16, treeHeight - 30);

            ctx.fillStyle = treeColor;
            ctx.beginPath();
            ctx.arc(x + 20, groundY - treeHeight + 15, 35, 0, Math.PI * 2);
            ctx.fill();
        }

        // JURANG & DINDING TEBING
        ctx.fillStyle = "#150303";
        ctx.fillRect(0, groundY + 30, world.width, canvas.height - groundY);

        grounds.forEach(g => {
            ctx.fillStyle = "#362217";
            ctx.fillRect(g.x - 12, groundY, 12, 100); 
            ctx.fillRect(g.x + g.width, groundY, 12, 100);

            ctx.fillStyle = "#24150d";
            ctx.fillRect(g.x - 6, groundY, 6, 100);
            ctx.fillRect(g.x + g.width, groundY, 6, 100);

            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(g.x, groundY, g.width, 10);
            ctx.fillStyle = "#4e3629";
            ctx.fillRect(g.x, groundY + 10, g.width, 30);

            ctx.fillStyle = "#27ae60";
            ctx.fillRect(g.x - 4, groundY + 10, 6, 8);
            ctx.fillRect(g.x + g.width - 2, groundY + 10, 6, 8);
        });

        platforms.forEach(p => {
            ctx.fillStyle = "#d35400";
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = "#e67e22";
            ctx.fillRect(p.x, p.y, p.width, 4);
        });
    }

    // RESTART FUNCTION TANPA REFRESH WEB
    function resetGame() {
        gameOver = false;
        gameWin = false;
        isPaused = false;
        player.x = 50;
        player.y = 150;
        player.speedX = 0;
        player.speedY = 0;
        player.hp = 100;
        player.score = 0;
        player.hasShield = false;
        player.shieldPurchased = 0;
        player.ghostCharges = 0;
        player.ghostPurchased = 0;
        player.isGhostActive = false;

        patrolMonsters.forEach(m => m.alive = true);
        undergroundMonsters.forEach(um => { um.alive = true; um.spawned = false; um.y = groundY + 40; });
        flyingMonsters.forEach(fm => fm.alive = true);
        coins.forEach(c => c.collected = false);

        checkGhostButtonVisibility();
    }

    // LISTENER RESTART DENGAN KLIK/TOUCH CANVAS
    canvas.addEventListener("click", (e) => {
        if (gameOver || gameWin) {
            resetGame();
        }
    });

    // GAME LOOP
    function gameLoop() {
        animTimer++;
        ctx.save();

        cameraX = player.x - canvas.width / 3;
        if (cameraX < 0) cameraX = 0;
        if (cameraX > world.width - canvas.width) cameraX = world.width - canvas.width;

        let shakeX = 0, shakeY = 0;
        if (screenShake > 0) {
            shakeX = (Math.random() - 0.5) * 10;
            shakeY = (Math.random() - 0.5) * 10;
            screenShake--;
        }

        ctx.translate(-cameraX + shakeX, shakeY);

        if (!gameOver && !gameWin && !isPaused) {
            if (keys.left) {
                player.speedX = -player.maxSpeed;
                player.facingLeft = true;
            } else if (keys.right) {
                player.speedX = player.maxSpeed;
                player.facingLeft = false;
            } else {
                player.speedX = 0;
            }

            player.speedY += player.gravity;
            player.x += player.speedX;
            player.y += player.speedY;

            if (player.invincibleTimer > 0) player.invincibleTimer--;

            if (player.isGhostActive) {
                player.ghostTimer--;
                if (player.ghostTimer <= 0) player.isGhostActive = false;
            }

            let onGround = false;
            grounds.forEach(g => {
                if (player.x + player.width > g.x && player.x < g.x + g.width) {
                    if (player.y + player.height >= groundY && player.y + player.height <= groundY + 15) {
                        player.y = groundY - player.height;
                        player.speedY = 0;
                        player.isGrounded = true;
                        onGround = true;
                    }
                }
            });

            platforms.forEach(p => {
                if (player.x + player.width > p.x && player.x < p.x + p.width) {
                    if (player.y + player.height >= p.y && player.y + player.height <= p.y + 12 && player.speedY >= 0) {
                        player.y = p.y - player.height;
                        player.speedY = 0;
                        player.isGrounded = true;
                        onGround = true;
                    }
                }
            });

            if (!onGround && player.y + player.height < groundY) player.isGrounded = false;

            if (player.y > canvas.height + 50) {
                player.hp = 0;
                gameOver = true;
                playSound('gameover');
            }

            if (player.x < 0) player.x = 0;

            // LOGIKA TABRAKAN MONSTER
            const checkMonsterCollision = (m) => {
                if (!m.alive) return;
                const isOverlapping = 
                    player.x < m.x + m.width &&
                    player.x + player.width > m.x &&
                    player.y < m.y + m.height &&
                    player.y + player.height > m.y;

                if (isOverlapping) {
                    if (player.speedY > 0 && (player.y + player.height - player.speedY) <= m.y + 12) {
                        m.alive = false;
                        player.speedY = -7.5;
                        player.score += 50;
                        playSound('hit');
                        addFloatingText("+50", m.x, m.y, "#f1c40f");
                    } 
                    else if (!player.isGhostActive && player.invincibleTimer === 0) {
                        if (player.hasShield) {
                            player.hasShield = false;
                            player.invincibleTimer = 30;
                            screenShake = 10;
                            playSound('hit');
                            addFloatingText("SHIELD BROKEN!", player.x, player.y - 10, "#00f0ff");
                        } else {
                            player.hp -= 30;
                            screenShake = 15;
                            player.invincibleTimer = 35;
                            player.speedX = player.x < m.x ? -6 : 6;
                            playSound('hit');
                            addFloatingText("-30 HP", player.x, player.y - 10, "#ff0055");

                            if (player.hp <= 0) {
                                player.hp = 0;
                                gameOver = true;
                                playSound('gameover');
                            }
                        }
                    }
                }
            };

            patrolMonsters.forEach(m => {
                if (m.alive) {
                    m.x += m.speedX;
                    if (m.x <= m.minX || m.x + m.width >= m.maxX) m.speedX *= -1;
                    checkMonsterCollision(m);
                }
            });

            undergroundMonsters.forEach(um => {
                if (um.alive) {
                    const distToPlayer = Math.abs(player.x - um.x);
                    if (!um.spawned && distToPlayer < um.triggerDist) um.spawned = true;
                    if (um.spawned && um.y > um.targetY) um.y -= 5;
                    if (um.spawned) checkMonsterCollision(um);
                }
            });

            // GERAKAN & HITBOX FLYING MONSTER (GHOST)
            flyingMonsters.forEach(fm => {
                if (fm.alive) {
                    fm.y = fm.startY + Math.sin(animTimer * fm.speedY) * fm.range;
                    checkMonsterCollision(fm);
                }
            });

            coins.forEach(coin => {
                if (!coin.collected) {
                    const dist = Math.hypot((player.x + player.width / 2) - coin.x, (player.y + player.height / 2) - coin.y);
                    if (dist < coin.radius + 15) {
                        coin.collected = true;
                        player.score += 25;
                        playSound('coin');
                        addFloatingText("+25", coin.x, coin.y, "#f1c40f");
                    }
                }
            });

            if (player.x + player.width >= flag.x && player.y + player.height >= flag.y) {
                gameWin = true;
                playSound('win');
            }
        }

        // RENDERING SCENE
        ctx.clearRect(0, 0, world.width, world.height);
        drawAdvancedBackground();

        // FINISH FLAG
        ctx.fillStyle = "#8e44ad";
        ctx.fillRect(flag.x, flag.y, 6, flag.height);
        ctx.fillStyle = "#f1c40f";
        ctx.beginPath();
        ctx.moveTo(flag.x + 6, flag.y);
        ctx.lineTo(flag.x + 30, flag.y + 15);
        ctx.lineTo(flag.x + 6, flag.y + 30);
        ctx.fill();

        // KOIN
        coins.forEach(coin => {
            if (!coin.collected) {
                let coinScale = Math.abs(Math.sin(animTimer * 0.1));
                ctx.save();
                ctx.translate(coin.x, coin.y);
                ctx.scale(coinScale, 1);
                ctx.fillStyle = "#f39c12";
                ctx.beginPath();
                ctx.arc(0, 0, coin.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(-2, -4, 4, 8);
                ctx.restore();
            }
        });

        // PATROL MONSTER
        patrolMonsters.forEach(m => {
            if (m.alive) {
                ctx.save();
                let bounceY = Math.sin(animTimer * 0.2) * 3;
                let isMovingLeft = m.speedX < 0;

                ctx.translate(m.x + m.width / 2, m.y + m.height / 2 + bounceY);
                if (isMovingLeft) ctx.scale(-1, 1);

                if (monsterImg.complete && monsterImg.naturalWidth !== 0) {
                    ctx.drawImage(monsterImg, -m.width / 2, -m.height / 2, m.width, m.height);
                } else {
                    ctx.fillStyle = "#ff0055";
                    ctx.fillRect(-m.width / 2, -m.height / 2, m.width, m.height);
                }
                ctx.restore();
            }
        });

        // UNDERGROUND MONSTER
        undergroundMonsters.forEach(um => {
            if (um.alive && um.spawned) {
                if (monsterImg.complete && monsterImg.naturalWidth !== 0) {
                    ctx.drawImage(monsterImg, um.x, um.y, um.width, um.height);
                } else {
                    ctx.fillStyle = "#9b59b6";
                    ctx.fillRect(um.x, um.y, um.width, um.height);
                }
            }
        });

        // FLYING MONSTER (GHOST)
        flyingMonsters.forEach(fm => {
            if (fm.alive) {
                ctx.save();
                ctx.translate(fm.x, fm.y);
                if (ghostImg.complete && ghostImg.naturalWidth !== 0) {
                    ctx.drawImage(ghostImg, 0, 0, fm.width, fm.height);
                } else {
                    ctx.fillStyle = "#95a5a6";
                    ctx.fillRect(0, 0, fm.width, fm.height);
                }
                ctx.restore();
            }
        });

        // DRAW KSATRIA / KNIGHT (PLAYER)
        if (player.invincibleTimer % 4 < 2) {
            ctx.save();
            
            let bounceY = (player.speedX !== 0 && player.isGrounded) ? Math.sin(animTimer * 0.3) * 2 : 0;

            ctx.translate(player.x + player.width / 2, player.y + player.height / 2 + bounceY);
            if (player.facingLeft) ctx.scale(-1, 1);

            if (player.isGhostActive) ctx.globalAlpha = 0.4;

            // DRAW BASE CHARACTER IMAGE
            if (playerImg.complete && playerImg.naturalWidth !== 0) {
                ctx.drawImage(playerImg, -player.width / 2, -player.height / 2, player.width, player.height);
            } else {
                ctx.fillStyle = "#3498db";
                ctx.fillRect(-player.width / 2, -player.height / 2, player.width, player.height);
            }

            // TAMBAHAN AMAN: PEDANG DI TANGAN KSATRIA
            ctx.fillStyle = "#bdc3c7";
            ctx.fillRect(10, -5, 12, 3); // Bilah Pedang
            ctx.fillStyle = "#f1c40f";
            ctx.fillRect(8, -7, 3, 7);  // Gagang Pedang

            if (player.hasShield) {
                ctx.strokeStyle = "#00f0ff";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 28, 0, Math.PI * 2);
                ctx.stroke();
            }

            ctx.restore();
        }

        // RENDER DEBU & FLOATING TEXTS
        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, 3, 3);
            if (p.life <= 0) particles.splice(index, 1);
        });

        floatingTexts.forEach((ft, index) => {
            ft.y += ft.vy;
            ft.life--;
            ctx.fillStyle = ft.color;
            ctx.font = "bold 11px monospace";
            ctx.fillText(ft.text, ft.x, ft.y);
            if (ft.life <= 0) floatingTexts.splice(index, 1);
        });

        ctx.restore();

        // UI HUD
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(10, 10, 120, 16);
        ctx.fillStyle = "#ff0055";
        ctx.fillRect(12, 12, (player.hp / player.maxHp) * 116, 12);
        ctx.fillStyle = "#fff";
        ctx.font = "10px monospace";
        ctx.fillText(`HP: ${player.hp}`, 15, 22);

        ctx.fillStyle = "#f1c40f";
        ctx.font = "bold 13px monospace";
        ctx.fillText(`SCORE: ${player.score}`, canvas.width - 110, 22);

        ctx.fillStyle = "#fff";
        ctx.font = "11px monospace";
        ctx.fillText(`SHIELD: ${player.hasShield ? "READY" : "NONE"}`, 10, 42);
        ctx.fillText(`GHOST: ${player.ghostCharges}x ${player.isGhostActive ? "(ACTIVE!)" : ""}`, 10, 56);

        // SCREEN OVERLAY GAME OVER & WIN (+ RESTART BUTTON LOGIC)
        if (gameOver) {
            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff0055";
            ctx.font = "bold 24px monospace";
            ctx.textAlign = "center";
            ctx.fillText("YOU DIED", canvas.width / 2, 120);
            ctx.font = "12px monospace";
            ctx.fillStyle = "#fff";
            ctx.fillText("Masa ksatria gitu aja kalah, Semangat dong!", canvas.width / 2, 150);

            // BUTTON RESTART
            ctx.fillStyle = "#ff0055";
            ctx.fillRect(canvas.width / 2 - 60, 180, 120, 35);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 13px monospace";
            ctx.fillText("COBA LAGI 🔄", canvas.width / 2, 202);
            ctx.textAlign = "left";
        } else if (gameWin) {
            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#2ecc71";
            ctx.font = "bold 22px monospace";
            ctx.textAlign = "center";
            ctx.fillText("HARDCORE LEVEL CLEARED!", canvas.width / 2, 110);
            ctx.fillStyle = "#f1c40f";
            ctx.font = "bold 15px monospace";
            ctx.fillText("LU KELAS BANGET BRE!", canvas.width / 2, 145);

            // BUTTON RESTART
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(canvas.width / 2 - 60, 180, 120, 35);
            ctx.fillStyle = "#000";
            ctx.font = "bold 13px monospace";
            ctx.fillText("MAIN LAGI 🔄", canvas.width / 2, 202);
            ctx.textAlign = "left";
        }

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
